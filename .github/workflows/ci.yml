name: CI

on:
  push:
    branches: [main, develop, publish]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.dangerously-allow-all-builds=true

      - name: Run tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
